<!doctype html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="/src/style.css">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	<body>
		<picture>
			<source srcset="/polytrisLogo.avif" type="image/avif">
			<source srcset="/polytrisLogo.webp" type="image/webp">
			<img src="/polytrisLogo.png" class="large-logo">
		</picture>
		<div class="button-group">
			<button>
				<img src="/singleplayer-icon.svg">
				<span>singleplayer</span>
			</button>
			<button>
				<img src="/multiplayer-icon.svg">
				<span>multiplayer</span>
			</button>
			<button>
				<img src="/config-icon.svg">
				<span>configuration</span>
			</button>
		</div>
		<img class="decoration" src="/menu-decoration.png">
		<div class="version">v0.0.1</div>
	</body>
</html>
